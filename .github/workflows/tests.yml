name: Tests

on:
  pull_request:
  push:
    branches: [main, feature/multiframe-science-viewer]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: python -m pip install -r api/requirements-dev.txt
      - run: python -m playwright install chromium --with-deps
      - run: python -m pytest -q api/test_server.py tests/browser/test_viewer.py
